function applyOct(){
 EXS.forEach(x=>{if(!S.ex.find(e=>e.n===x[0]))S.ex.push({id:'e'+uid(),n:x[0],g:x[1],eq:x[2]})});
 const byN=n=>S.ex.find(e=>e.n===n);
 for(const k of ['t','s']){const u=S.u[k],old=new Set(SEEDB[k].filter(b=>b[0].length===1).map(b=>k+b[0]));
  u.blocks=u.blocks.filter(b=>!old.has(b.id)&&!/^[ts]O[A-E]$/.test(b.id));
  OCT[k].forEach((b,i)=>u.blocks.push({id:k+'O'+b[0],code:b[0],name:b[1],c:BC[i%7],items:b[2].map(it=>({ex:byN(it[0]).id,sets:it[1],reps:it[2],rest:it[3]}))}));

}

function weekDates(base){const d=base?new Date(base):new Date();d.setDate(d.getDate()-dow(d));return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
const logOn=(k,date)=>S.u[k].logs.find(l=>l.date===date);
function streak(k){const u=S.u[k];let n=0;const now=new Date();for(let i=0;i<120;i++){const d=new Date(now);d.setDate(now.getDate()-i);const done=u.logs.some(l=>l.date===iso(d));if(done)n++;else if(u.plan[dow(d)].length&&i>0)break}return n}
function weekStats(k){const u=S.u[k],ds=weekDates();return{done:ds.filter(d=>logOn(k,iso(d))).length,plan:ds.filter(d=>u.plan[dow(d)].length).length}}
const vol=l=>l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.kg*s.reps,0),0);
const blockMin=b=>Math.round(b.items.reduce((a,i)=>{const m=/(\d+)\s*(?:-\s*\d+\s*)?min/.exec(i.reps);return a+(m?+m[1]*60:i.sets*(45+i.rest))},0)/60);
const chipB=(b,x='')=>`<span class="chip" style="--c:${b.c}">${esc(b.code)} · ${esc(b.name)}</span>`;
function lastSets(k,exId){const ls=S.u[k].logs;for(let i=ls.length-1;i>=0;i--){const e=ls[i].entries.find(x=>x.ex===exId);if(e&&e.sets.length)return e.sets}return null}
function bestKg(k,exId){let m=0;S.u[k].logs.forEach(l=>l.entries.forEach(e=>{if(e.ex===exId)e.sets.forEach(s=>{if(s.kg>m)m=s.kg})}));return m}
function series(k,exId,metric){const pts=[];S.u[k].logs.forEach(l=>{const e=l.entries.find(x=>x.ex===exId);if(!e)return;let v=0;e.sets.forEach(s=>{const c=metric==='reps'?s.reps:metric==='rm'?s.kg*(1+s.reps/30):s.kg;if(c>v)v=c});pts.push({t:pd(l.date).getTime(),v:Math.round(v*10)/10})});return pts}
function prEvents(k){const best={},ev=[];S.u[k].logs.forEach(l=>l.entries.forEach(e=>{const m=Math.max(0,...e.sets.map(s=>s.kg));if(m>0){if(best[e.ex]!==undefined&&m>best[e.ex])ev.push({k,date:l.date,ex:e.ex,kg:m});if(best[e.ex]===undefined||m>best[e.ex])best[e.ex]=m}}));return ev}

function lineChart(pts,{unit='',color='var(--me)'}={}){
 if(pts.length<2)return`<p class="mut sm-t" style="margin:0">Hacen falta al menos 2 registros para ver el gráfico.</p>`;
 const W=340,H=170,L=38,B=22,T=12,Rr=14;
 let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(hi===lo){hi+=1;lo-=1}
 const pd_=(hi-lo)*.12;lo=Math.max(0,lo-pd_);hi+=pd_;
 const t0=pts[0].t,t1=pts[pts.length-1].t||1,xs=t=>L+(t-t0)/Math.max(1,t1-t0)*(W-L-Rr),ys=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
 let g='';for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3,y=ys(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" fill="var(--mut)" font-size="11">${fk(v)}</text>`}
 const P=pts.map(p=>`${xs(p.t).toFixed(1)},${ys(p.v).toFixed(1)}`).join(' '),last=pts[pts.length-1];
 const lab=t=>new Date(t).toLocaleDateString('es-AR',{day:'numeric',month:'short'});
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de evolución">${g}<polygon points="${xs(t0)},${H-B} ${P} ${xs(t1)},${H-B}" fill="${color}" opacity=".14"/><polyline points="${P}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${xs(p.t).toFixed(1)}" cy="${ys(p.v).toFixed(1)}" r="3" fill="${color}"/>`).join('')}<circle cx="${xs(last.t)}" cy="${ys(last.v)}" r="6" fill="none" stroke="${color}" stroke-width="2"/><text x="${L}" y="${H-5}" fill="var(--mut)" font-size="11">${lab(t0)}</text><text x="${W-Rr}" y="${H-5}" text-anchor="end" fill="var(--mut)" font-size="11">${lab(t1)}</text></svg>`}

function startWork(blockIds,uk){
 const u=S.u[uk];const bl=blockIds.map(id=>u.blocks.find(b=>b.id===id)).filter(Boolean);
 if(!bl.length){toast('Elegí al menos un bloque');return}
 const mk=(it,bid)=>{const last=lastSets(uk,it.ex);return{ex:it.ex,bid,rest:it.rest,target:it.sets+' × '+it.reps,sets:Array.from({length:it.sets},(_,i)=>{const l=last&&last[Math.min(i,last.length-1)];return{kg:l?l.kg:0,reps:l?l.reps:(parseInt(it.reps)||10),done:false,auto:true}})}};
 const entries=[],bs=bl.map(b=>({id:b.id,code:b.code,name:b.name,c:b.c}));
 bl.forEach(b=>b.items.forEach(it=>entries.push(mk(it,b.id))));
 const fx=(u.fixed||[]).filter(id=>!entries.some(e=>e.ex===id));
 if(fx.length){bs.push({id:'fijos',code:'★',name:'Fijos',c:'#f2b84b'});fx.forEach(id=>entries.push(mk({ex:id,sets:3,reps:'15',rest:45},'fijos')))}
 S.draft={uk,start:Date.now(),b:bs,entries,restEnd:0,restTotal:0};
 save();ui.full='work';ui.sheet=null;unlockAudio();try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}render(false);
}
function vWork(){

 const cards=d.entries.map((e,i)=>{const x=X(e.ex),ls=lastSets(d.uk,e.ex),open=i===cur,fin=e.sets.every(s=>s.done);
  const bh=e.bid!==lastB?(lastB=e.bid,`<div class="lbl" style="margin-top:4px">${esc(d.b.find(b=>b.id===e.bid)?.code||'')} · ${esc(d.b.find(b=>b.id===e.bid)?.name||'')}</div>`):'';

  ${open||!fin?`<div class="setr xs mut"><span>#</span><span style="text-align:center">Kg</span><span style="text-align:center">Reps</span><span></span></div>${e.sets.map((s,j)=>`<div class="setr ${s.done?'dn':''}"><span class="mut">${j+1}</span><input inputmode="decimal" value="${s.kg}" data-in="wkg" data-e="${i}" data-s="${j}" aria-label="Kilos serie ${j+1}"><input inputmode="numeric" value="${s.reps}" data-in="wreps" data-e="${i}" data-s="${j}" aria-label="Repeticiones serie ${j+1}"><button class="chk ${s.done?'on':''}" data-a="setdone" data-e="${i}" data-s="${j}" aria-label="Marcar serie ${j+1}">${ic('check','s')}</button></div>`).join('')}<div class="row"><button class="btn g sm" data-a="addset" data-e="${i}">${ic('plus','s')} Serie</button></div>`:''}</div>`}).join('');

let actx;function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();const o=actx.createOscillator(),g=actx.createGain();g.gain.value=0;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+.01)}catch(e){}}
function beep(){try{unlockAudio();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(actx.currentTime+.35)}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function tick(){

 if(d.restEnd){const left=Math.ceil((d.restEnd-Date.now())/1000);if(left<=0){d.restEnd=0;beep();r.hidden=true;toast('Terminó el descanso');save()}else{r.hidden=false;$('#rt').textContent=pad(Math.floor(left/60))+':'+pad(left%60)}}else r.hidden=true;
}
setInterval(tick,400);document.addEventListener('visibilitychange',tick);

 if(s.t==='addday')h=`<h2>Agregar al ${DAYS[s.d].toLowerCase()}</h2>${u.blocks.map(b=>{const has=u.plan[s.d].includes(b.id);return`<button class="ex" ${has?'disabled':''} data-a="adddayb" data-b="${b.id}"><span class="code" style="--c:${b.c}">${esc(b.code)}</span><div class="grow"><div>${esc(b.name)}</div><div class="mut xs">${b.items.length} ejercicios</div></div>${has?'<span class="mut xs">Ya está</span>':''}</button>`}).join('')}<button class="btn g" data-a="newb">${ic('plus','s')} Crear bloque nuevo</button>`;
 if(s.t==='startpick')h=`<h2>¿Qué entrenás?</h2>${u.blocks.map(b=>`<button class="ex" data-a="stog" data-b="${b.id}"><span class="code" style="--c:${b.c}">${esc(b.code)}</span><div class="grow"><div>${esc(b.name)}</div><div class="mut xs">${b.items.length} ejercicios · ${blockMin(b)} min</div></div><span class="chk ${s.sel.includes(b.id)?'on':''}" style="width:34px;height:34px">${s.sel.includes(b.id)?ic('check','s'):''}</span></button>`).join('')}<button class="btn" data-a="gostart">Empezar (${s.sel.length})</button>`;
 if(s.t==='pick')h=`<h2>Agregar ejercicios</h2><input id="q" placeholder="Buscar ejercicio" value="${esc(ui.q)}" data-in="q" autocomplete="off"><div class="chips">${['',...GROUPS].map(g=>`<button class="chip ${ui.g===g?'sel':''}" data-a="grp" data-g="${g}">${g||'Todos'}</button>`).join('')}</div><div id="exl">${exList('pick')}</div><button class="btn" data-a="pdone">Listo (${ui.pick.sel.length})</button>`;
 if(s.t==='exinfo'){const x=X(s.x),ls=lastSets(S.me,x.id),lo=lastSets(OK(),x.id);h=`<h2>${esc(x.n)}</h2><div class="mut">${x.g} · ${x.eq}</div><div class="row"><div class="stat"><div class="big num">${fk(bestKg(S.me,x.id))}<span class="mut" style="font-size:16px"> kg</span></div><div class="mut xs">tu máximo</div></div><div class="stat"><div class="big num">${fk(bestKg(OK(),x.id))}<span class="mut" style="font-size:16px"> kg</span></div><div class="mut xs">máximo de ${esc(O().name)}</div></div></div><div class="mut sm-t">${ls?'Tu última vez: '+ls.map(s=>s.reps+'×'+fk(s.kg)).join(' · '):'Todavía no lo hiciste.'}</div><button class="btn ${(u.fixed||[]).includes(x.id)?'':'g'}" data-a="fixtog" data-x="${x.id}">${(u.fixed||[]).includes(x.id)?'★ Fijo en todos mis entrenos (tocá para quitar)':'☆ Hacer siempre en todos mis entrenos'}</button>`}
 if(s.t==='newex')h=`<h2>Nuevo ejercicio</h2><input id="nxn" placeholder="Nombre del ejercicio"><select id="nxg">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select><select id="nxe">${EQUIP.map(g=>`<option>${g}</option>`).join('')}</select><button class="btn" data-a="savex">Guardar ejercicio</button>`;
 if(s.t==='photo'){const p=u.photos[s.i];h=`<div class="mut">${fd(p.date,{day:'numeric',month:'long',year:'numeric'})}</div><img src="${p.d}" alt="Foto de progreso" style="width:100%;max-height:60vh;object-fit:contain;border-radius:12px"><button class="btn bad" data-a="delphoto">Borrar foto</button>`}
 if(s.t==='day'){const rows=['t','s'].map(k=>{const l=logOn(k,s.date);return l?`<div class="card"><b style="color:${col(k)}">${esc(S.u[k].name)}</b><div>${l.b.map(b=>esc(b.name)).join(' + ')}</div><div class="mut xs">${l.min} min · ${Math.round(vol(l)).toLocaleString('es-AR')} kg · ${l.entries.length} ejercicios</div></div>`:''}).join('');h=`<h2>${fd(s.date,{weekday:'long',day:'numeric',month:'long'})}</h2>${rows||'<div class="mut">Nadie entrenó este día.</div>'}`}
 if(s.t==='quit')h=`<h2>¿Salir del entrenamiento?</h2><button class="btn" data-a="sclose">Seguir entrenando</button><button class="btn g" data-a="pause">Salir y continuar después</button><button class="btn bad" data-a="discard">Descartar entrenamiento</button>`;
 if(s.t==='discard')h=`<h2>No marcaste ninguna serie</h2><div class="mut">Si terminás ahora no se guarda nada.</div><button class="btn" data-a="sclose">Seguir entrenando</button><button class="btn bad" data-a="discard">Descartar</button>`;
 el.innerHTML=sheet(h);
}

function curBlocks(){return U().blocks}
function setPlan(day,fn){const p=U().plan;p[day]=fn(p[day]||[]);save()}
function newBlock(){const u=U(),used=u.blocks.map(b=>b.code),code=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].find(c=>!used.includes(c))||'X';return{id:null,code,name:'',c:BC[u.blocks.length%7],items:[]}}
function defRest(x){return x.eq==='Barra'?90:60}

document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-a]');if(!t||t.disabled)return;const a=t.dataset.a,d=t.dataset,u=U(),dr=S.draft;
 const R=(k=true)=>{render(k)};
 switch(a){
 case'tab':ui.tab=d.t;ui.sheet=null;R(false);break;
 case'user':ui.sheet={t:'user'};ui.arm=null;R();break;
 case'who':S.me=d.k;ui.sheet=null;ui.progEx=null;save();R(false);break;
 case'names':S.u.t.name=$('#nt').value.trim()||S.u.t.name;S.u.s.name=$('#ns').value.trim()||S.u.s.name;ui.sheet=null;save();R();toast('Nombres guardados');break;
 case'reset':if(ui.arm==='reset'){applyOct();save();ui.arm=null;ui.sheet=null;R(false);toast('Rutinas del mes restablecidas')}else{ui.arm='reset';R()}break;
 case'sclose':ui.sheet=null;R();break;
 case'start':startWork(u.plan[dow(new Date())],S.me);break;
 case'resume':unlockAudio();ui.full='work';R(false);break;
 case'pickstart':ui.sheet={t:'startpick',sel:u.plan[dow(new Date())].slice()};R();break;
 case'stog':{const s=ui.sheet.sel,i=s.indexOf(d.b);i<0?s.push(d.b):s.splice(i,1);R()}break;
 case'gostart':startWork(ui.sheet.sel,S.me);break;
 case'weekof':ui.weekOf=d.w;R();break;
 case'chip':ui.sheet={t:'chip',b:d.b,d:+d.d};R();break;
 case'addday':ui.sheet={t:'addday',d:+d.d};R();break;
 case'adddayb':setPlan(ui.sheet.d,l=>[...l,d.b]);ui.sheet=null;R();break;
 case'moveb':{const f=ui.sheet.d,b=ui.sheet.b,to=+d.to;setPlan(f,l=>l.filter(x=>x!==b));setPlan(to,l=>l.includes(b)?l:[...l,b]);ui.sheet=null;R();toast('Movido al '+DAYS[to].toLowerCase())}break;
 case'alsob':{const b=ui.sheet.b,to=+d.to;setPlan(to,l=>l.includes(b)?l:[...l,b]);ui.sheet=null;R();toast('Agregado al '+DAYS[to].toLowerCase())}break;
 case'rmb':{const b=ui.sheet.b;setPlan(ui.sheet.d,l=>l.filter(x=>x!==b));ui.sheet=null;R()}break;
 case'bseg':ui.bseg=d.s;ui.q='';ui.g='';R();break;
 case'grp':ui.g=d.g;if(ui.sheet&&ui.sheet.t==='pick')R();else R();break;
 case'newb':ui.edit=newBlock();ui.full='edit';ui.sheet=null;R(false);break;
 case'editb':{const b=u.blocks.find(x=>x.id===d.b);ui.edit=JSON.parse(JSON.stringify(b));ui.full='edit';ui.sheet=null;ui.arm=null;R(false)}break;
 case'copyb':{const b=JSON.parse(JSON.stringify(O().blocks.find(x=>x.id===d.b)));b.id=S.me+uid();const used=u.blocks.map(x=>x.code);if(used.includes(b.code))b.code=[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].find(c=>!used.includes(c))||b.code;u.blocks.push(b);save();R();toast('Bloque copiado a tus bloques')}break;
 case'eclose':ui.full=null;ui.edit=null;R();break;
 case'ecolor':ui.edit.c=d.c;R();break;
 case'esave':{const b=ui.edit;b.name=($('#ename').value||'').trim()||'Sin nombre';b.code=($('#ecode').value||'').trim().toUpperCase()||'?';
  if(!b.items.length){toast('Agregá al menos un ejercicio');break}
  if(b.id){const i=u.blocks.findIndex(x=>x.id===b.id);u.blocks[i]=b}else{b.id=S.me+uid();u.blocks.push(b)}
  save();ui.full=null;ui.edit=null;R();toast('Bloque guardado')}break;
 case'emove':{const i=+d.i,j=i+ +d.d,it=ui.edit.items;if(j>=0&&j<it.length){[it[i],it[j]]=[it[j],it[i]]}R()}break;
 case'edel':ui.edit.items.splice(+d.i,1);R();break;
 case'eset':{const it=ui.edit.items[+d.i];it.sets=Math.max(1,Math.min(10,it.sets+ +d.d));R()}break;
 case'erest':{const it=ui.edit.items[+d.i];it.rest=Math.max(0,Math.min(300,it.rest+ +d.d));R()}break;
 case'epick':ui.q='';ui.g='';ui.pick={sel:[]};ui.sheet={t:'pick'};R();break;
 case'ptog':{const s=ui.pick.sel,i=s.indexOf(d.x);i<0?s.push(d.x):s.splice(i,1);const l=$('#exl');l.innerHTML=exList('pick');$('.sheet .btn').textContent='Listo ('+s.length+')'}break;
 case'pdone':ui.pick.sel.forEach(id=>{const x=X(id);ui.edit.items.push({ex:id,sets:3,reps:'10-12',rest:defRest(x)})});ui.sheet=null;R();break;
 case'edelb':if(ui.arm==='delb'){const id=ui.edit.id;u.blocks=u.blocks.filter(b=>b.id!==id);for(let i=0;i<7;i++)u.plan[i]=u.plan[i].filter(x=>x!==id);ui.arm=null;ui.full=null;ui.edit=null;save();R();toast('Bloque eliminado')}else{ui.arm='delb';R()}break;
 case'exinfo':ui.sheet={t:'exinfo',x:d.x};R();break;
 case'setup':{const a=$('#su1').value.trim(),b=$('#su2').value.trim();if(!a||!b){toast('Escribí los dos nombres');break}S.u.t.name=a;S.u.s.name=b;if(d.o==='1')applyOct();S.setup=true;S.me='t';ui.full=null;ui.tab='hoy';save();R(false)}break;
 case'wipe':if(ui.arm==='wipe'){S=emptyState();ui.arm=null;ui.sheet=null;ui.progEx=null;ui.tab='hoy';ui.full='setup';save();R(false)}else{ui.arm='wipe';R()}break;
 case'newex':ui.sheet={t:'newex'};R();break;
 case'fixtog':{u.fixed=u.fixed||[];const i=u.fixed.indexOf(d.x);i<0?u.fixed.push(d.x):u.fixed.splice(i,1);save();R();toast(i<0?'Ahora es fijo en tus entrenos':'Ya no es fijo')}break;
 case'savex':{const n=$('#nxn').value.trim();if(!n){toast('Escribí el nombre');break}S.ex.push({id:'e'+uid(),n,g:$('#nxg').value,eq:$('#nxe').value});save();ui.sheet=null;R();toast('Ejercicio agregado')}break;
 case'pseg':ui.pseg=d.s;R();break;
 case'metric':ui.metric=d.m;R();break;
 case'addbw':{const v=parseFloat(($('#bwv').value||'').replace(',','.'));if(!(v>20&&v<300)){toast('Ingresá un peso válido');break}const td=todayISO(),i=u.bw.findIndex(b=>b.date===td);if(i>=0)u.bw[i].kg=v;else u.bw.push({date:td,kg:v});u.bw.sort((a,b)=>a.date.localeCompare(b.date));save();R();toast('Peso guardado')}break;
 case'photo':ui.sheet={t:'photo',i:+d.i};R();break;
 case'delphoto':u.photos.splice(ui.sheet.i,1);ui.sheet=null;save();R();break;
 case'calm':{let m=ui.cal.m+ +d.d,y=ui.cal.y;if(m<0){m=11;y--}if(m>11){m=0;y++}ui.cal={y,m};R()}break;
 case'day':ui.sheet={t:'day',date:d.d};R();break;
 case'setdone':{unlockAudio();const e=dr.entries[+d.e],j=+d.s,s=e.sets[j];s.done=!s.done;s.auto=false;
  if(s.done){e.sets.forEach((o,k)=>{if(k>j&&o.auto&&!o.done){o.kg=s.kg;o.reps=s.reps}});if(e.rest>0){dr.restEnd=Date.now()+e.rest*1000;dr.restTotal=e.rest}}
  save();const y=$('#wb').scrollTop;R();$('#wb')&&($('#wb').scrollTop=y);tick()}break;
 case'addset':{const e=dr.entries[+d.e],l=e.sets[e.sets.length-1];e.sets.push({kg:l?l.kg:0,reps:l?l.reps:10,done:false,auto:true});save();const y=$('#wb').scrollTop;R();$('#wb').scrollTop=y}break;
 case'rest':if(+d.d===0)dr.restEnd=0;else dr.restEnd+= +d.d*1000;tick();save();break;
 case'quit':ui.sheet={t:'quit'};R();break;
 case'pause':ui.sheet=null;ui.full=null;R(false);toast('Quedó en pausa. Continuá desde Hoy');break;
 case'discard':S.draft=null;ui.sheet=null;ui.full=null;save();R(false);break;
 case'finish':finishWork();break;
 case'closesum':ui.full=null;ui.sum=null;ui.tab='hoy';R(false);break;
 }
});
document.addEventListener('input',ev=>{
 const t=ev.target,a=t.dataset.in;if(!a)return;
 if(a==='q'){ui.q=t.value;const l=$('#exl');if(l)l.innerHTML=exList(ui.sheet&&ui.sheet.t==='pick'?'pick':'lib')}
 else if(a==='wkg'||a==='wreps'){const s=S.draft.entries[+t.dataset.e].sets[+t.dataset.s];const v=parseFloat(t.value.replace(',','.'));s[a==='wkg'?'kg':'reps']=isNaN(v)?0:v;s.auto=false;save()}
 else if(a==='ereps')ui.edit.items[+t.dataset.i].reps=t.value;
 else if(a==='ename')ui.edit.name=t.value;
 else if(a==='ecode')ui.edit.code=t.value;
});
document.addEventListener('change',ev=>{
 const t=ev.target,a=t.dataset.in;
 if(a==='pe'){ui.progEx=t.value;render()}
 if(a==='photo'&&t.files[0]){const f=t.files[0],r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const sc=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);U().photos.push({date:todayISO(),d:c.toDataURL('image/jpeg',.7)});save();render();toast('Foto guardada')};im.src=r.result};r.readAsDataURL(f)}
});
if(S.draft)ui.full=null;
if(!S.setup)ui.full='setup';
render(false);

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body></html>
