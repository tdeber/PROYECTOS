function weekDates(base){const d=base?new Date(base):new Date();d.setDate(d.getDate()-dow(d));return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x})}
const logOn=(k,date)=>UU(k).logs.find(l=>l.date===date);
function streak(k){const u=UU(k);let n=0;const now=new Date();for(let i=0;i<120;i++){const d=new Date(now);d.setDate(now.getDate()-i);const done=u.logs.some(l=>l.date===iso(d));if(done)n++;else if((u.plan[dow(d)]||[]).length&&i>0)break}return n}
function weekStats(k){const u=UU(k),ds=weekDates();return{done:ds.filter(d=>logOn(k,iso(d))).length,plan:ds.filter(d=>(u.plan[dow(d)]||[]).length).length}}
const vol=l=>l.entries.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+s.kg*s.reps,0),0);
const blockMin=b=>Math.round(b.items.reduce((a,i)=>{const m=/(\d+)\s*(?:-\s*\d+\s*)?min/.exec(i.reps);return a+(m?+m[1]*60:i.sets*(45+i.rest))},0)/60);
const chipB=(b,x='')=>`<span class="chip" style="--c:${b.c}">${esc(b.code)} · ${esc(b.name)}</span>`;
function lastSets(k,exId){const ls=UU(k).logs;for(let i=ls.length-1;i>=0;i--){const e=ls[i].entries.find(x=>x.ex===exId);if(e&&e.sets.length)return e.sets}return null}
function bestKg(k,exId){let m=0;UU(k).logs.forEach(l=>l.entries.forEach(e=>{if(e.ex===exId)e.sets.forEach(s=>{if(s.kg>m)m=s.kg})}));return m}
function series(k,exId,metric){const pts=[];UU(k).logs.forEach(l=>{const e=l.entries.find(x=>x.ex===exId);if(!e)return;let v=0;e.sets.forEach(s=>{const c=metric==='reps'?s.reps:metric==='rm'?s.kg*(1+s.reps/30):s.kg;if(c>v)v=c});pts.push({t:pd(l.date).getTime(),v:Math.round(v*10)/10})});return pts}
function prEvents(k){const best={},ev=[];UU(k).logs.forEach(l=>l.entries.forEach(e=>{const m=Math.max(0,...e.sets.map(s=>s.kg));if(m>0){if(best[e.ex]!==undefined&&m>best[e.ex])ev.push({k,date:l.date,ex:e.ex,kg:m});if(best[e.ex]===undefined||m>best[e.ex])best[e.ex]=m}}));return ev}

const sync={state:'local',err:'',t:null,busy:false,pushed:''};
const SYNC_TXT={local:'solo en este celular',ok:'sincronizado',syncing:'sincronizando…',pending:'cambios sin enviar',offline:'sin conexión',error:'error al sincronizar'};

function renderHd(){
 const T={hoy:'Hoy',sem:'Semana',blo:'Bloques',pro:'Progreso',par:'Grupos'};
 $('#hd').innerHTML=`<h1>${T[ui.tab]}</h1><button class="av" data-a="user" aria-label="Perfil y cuenta">${avatarHtml()}</button>`}
function mergeEx(l){const map={};(Array.isArray(l)?l:[]).forEach(e=>{if(!e||!e.id)return;const mine=S.ex.find(x=>x.id===e.id),n=String(e.n||'').slice(0,80);
 if(!mine)S.ex.push({id:e.id,n,g:e.g,eq:e.eq});
 else if(String(mine.n).toLowerCase()!==n.toLowerCase()){const same=S.ex.find(x=>String(x.n).toLowerCase()===n.toLowerCase());if(same)map[e.id]=same.id;else{const nid='e'+uid();S.ex.push({id:nid,n,g:e.g,eq:e.eq});map[e.id]=nid}}});return map}
function remapRefs(r,map){if(!Object.keys(map).length)return r;const f=id=>map[id]||id;
 (r.blocks||[]).forEach(b=>(b.items||[]).forEach(i=>i.ex=f(i.ex)));(r.logs||[]).forEach(l=>(l.entries||[]).forEach(e=>e.ex=f(e.ex)));r.fixed=(r.fixed||[]).map(f);return r}
function mergeById(a,b){const m=new Map();(Array.isArray(a)?a:[]).forEach(x=>x&&x.id!==undefined&&m.set(x.id,x));(Array.isArray(b)?b:[]).forEach(x=>{if(x&&x.id!==undefined&&!m.has(x.id))m.set(x.id,x)});return[...m.values()]}
function mergeIn(rem){
 const u=U(),r=remapRefs(JSON.parse(JSON.stringify(rem.user||{})),mergeEx(rem.ex));
 u.blocks=mergeById(u.blocks,r.blocks);
 u.logs=mergeById(u.logs,r.logs).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
 const bw=new Map();(Array.isArray(r.bw)?r.bw:[]).forEach(x=>x&&x.date&&bw.set(x.date,x));(u.bw||[]).forEach(x=>bw.set(x.date,x));u.bw=[...bw.values()].sort((a,b)=>a.date.localeCompare(b.date));
 for(let i=0;i<7;i++){const l=(u.plan[i]||[]).slice();((r.plan&&Array.isArray(r.plan[i]))?r.plan[i]:[]).forEach(id=>{if(!l.includes(id)&&u.blocks.some(b=>b.id===id))l.push(id)});u.plan[i]=l}
 u.fixed=[...new Set([...(u.fixed||[]),...(Array.isArray(r.fixed)?r.fixed:[])])]}
function adopt(rem){
 const u=U(),r=remapRefs(JSON.parse(JSON.stringify(rem.user||{})),mergeEx(rem.ex));
 u.blocks=Array.isArray(r.blocks)?r.blocks:[];u.logs=Array.isArray(r.logs)?r.logs:[];u.bw=Array.isArray(r.bw)?r.bw:[];u.fixed=Array.isArray(r.fixed)?r.fixed:[];
 const p={};for(let i=0;i<7;i++)p[i]=(r.plan&&Array.isArray(r.plan[i]))?r.plan[i]:[];u.plan=p}
function wipeLocal(){const u=U();u.blocks=[];u.logs=[];u.bw=[];u.fixed=[];u.photos=[];const p={};for(let i=0;i<7;i++)p[i]=[];u.plan=p;S.draft=null;S.mt=0;S.syncedMt=0;S.linkedUid=null;lastDocStr=docStr()}

async function pushDoc(uid){
 const mt=S.mt||Date.now();S.mt=mt;
 const r=await sb.from('datos').upsert({user_id:uid,data:Object.assign({mt},docOf()),actualizado:new Date().toISOString()},{onConflict:'user_id'});
 if(r&&r.error)throw r.error;
 S.syncedMt=mt;S.linkedUid=uid;lastDocStr=docStr();save(false)}
async function syncNow(){
 if(!sb||!cloud.session||!cloud.perfil||sync.busy)return;
 sync.busy=true;sync.state='syncing';renderHd();
 try{
  const uid=cloud.session.user.id;
  if(S.linkedUid&&S.linkedUid!==uid)wipeLocal();            // datos de otra cuenta en este celular
  const r=await sb.from('datos').select('data').eq('user_id',uid).maybeSingle();
  if(r.error)throw r.error;
  const rem=r.data&&r.data.data&&r.data.data.user?r.data.data:null;
  if(!rem){await pushDoc(uid)}                                // primera vez en la nube: subir lo que hay
  else if(S.linkedUid!==uid){mergeIn(rem);S.mt=Date.now();await pushDoc(uid)}   // primera vinculacion: unir sin perder nada
  else if(rem.mt===S.syncedMt){if(S.mt>S.syncedMt)await pushDoc(uid)}
  else if(S.mt>S.syncedMt){mergeIn(rem);S.mt=Date.now();await pushDoc(uid)}      // cambiaron los dos lados

function lineChart(pts,{unit='',color='var(--me)'}={}){
 if(pts.length<2)return`<p class="mut sm-t" style="margin:0">Hacen falta al menos 2 registros para ver el gráfico.</p>`;
 const W=340,H=170,L=38,B=22,T=12,Rr=14;
 let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(hi===lo){hi+=1;lo-=1}

 const entries=[],bs=bl.map(b=>({id:b.id,code:b.code,name:b.name,c:b.c}));
